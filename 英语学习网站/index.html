<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffeef6">
<meta name="description" content="三年级英语乐园 · 2024新版人教PEP三年级上册 · 学一学/测一测/拼一拼/拖一拖/字母拼">
<title>🌈 三年级英语乐园 · 2024新版PEP</title>
<style>
  /* ============================================================
     设计变量
     ============================================================ */
  :root{
    --pink:#ff8fb1;      --pink-d:#e05b8a;   --pink-l:#ffe3ee;
    --blue:#7dc4f5;      --blue-d:#3d8fd0;   --blue-l:#dcefff;
    --yellow:#ffd93d;    --green:#6fd39a;    --green-d:#2e9e63;
    --purple:#b39ddb;    --ink:#4a4458;      --ink-2:#8b85a0;
    --card:#ffffff;
    --shadow:0 6px 0 rgba(160,140,190,.12), 0 14px 30px rgba(120,90,150,.12);
    --radius:24px;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, #ffe9f3 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #e6f4ff 0%, transparent 55%),
      linear-gradient(170deg,#fff8fc 0%,#f4f9ff 45%,#f3fff7 100%);
    min-height:100vh; color:var(--ink);
    padding-bottom:calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
  .emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;}

  /* 背景漂浮装饰 */
  .bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .bg-deco span{
    position:absolute;font-size:clamp(1.2rem,3.4vw,2rem);opacity:.28;
    animation:float 8s ease-in-out infinite;
    font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(5deg)}}

  #app{
    position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;
    padding:clamp(14px,3vw,28px) clamp(12px,3.4vw,24px) 40px;
  }

  /* ============================================================
     首页 hero
     ============================================================ */
  .hero{
    position:relative;display:flex;align-items:center;gap:clamp(8px,2vw,26px);
    padding:clamp(10px,2.4vw,22px) 0 clamp(14px,3vw,26px);
  }
  .hero-text{flex:1;min-width:0;}
  .hero-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff;border-radius:999px;padding:5px 12px;font-size:clamp(.68rem,1.9vw,.8rem);
    color:var(--pink-d);font-weight:700;box-shadow:0 3px 0 #ffe0ec;margin-bottom:8px;
  }
  .hero h1{
    font-size:clamp(1.5rem,4.6vw,2.4rem);line-height:1.18;letter-spacing:.5px;
    background:linear-gradient(90deg,#ff8fb1,#ffb86b,#7dc4f5,#a78bfa,#ff8fb1);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 7s linear infinite;
  }
  @keyframes shine{to{background-position:220% center}}
  .hero p{color:var(--ink-2);margin-top:8px;font-size:clamp(.82rem,2.3vw,1rem);line-height:1.5;}
  .hero-mascot{
    flex:none;width:clamp(96px,26vw,210px);align-self:flex-end;
    filter:drop-shadow(0 12px 18px rgba(150,110,180,.22));
    animation:bob 3.4s ease-in-out infinite;
  }
  .hero-mascot img{width:100%;display:block;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}

  /* 统计条 */
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 clamp(14px,3vw,22px);}
  .stat{
    display:flex;align-items:center;gap:7px;background:#fff;border-radius:14px;
    padding:8px 12px;font-size:clamp(.72rem,2vw,.86rem);font-weight:700;color:var(--ink-2);
    box-shadow:0 4px 0 rgba(170,150,200,.12);
  }
  .stat b{color:var(--pink-d);font-size:1.05em;}

  /* ============================================================
     单元卡片
     ============================================================ */
  .sec-title{
    display:flex;align-items:baseline;gap:8px;margin:0 2px 12px;
    font-size:clamp(.92rem,2.6vw,1.06rem);font-weight:800;color:#6b6386;
  }
  .sec-title small{font-weight:600;color:var(--ink-2);font-size:.76em;}

  .unit-grid{display:grid;gap:clamp(10px,2.2vw,16px);grid-template-columns:1fr;}
  @media (min-width:560px){
    .unit-grid{grid-template-columns:repeat(2,1fr);}
  }

  .unit-card{
    position:relative;overflow:hidden;background:var(--card);border-radius:var(--radius);
    padding:clamp(13px,2.6vw,18px);box-shadow:var(--shadow);cursor:pointer;
    border:3px solid transparent;transition:transform .18s,border-color .18s;
    --h:340;
  }
  .unit-card:hover{transform:translateY(-4px);border-color:hsl(var(--h) 90% 88%);}
  .unit-card:active{transform:scale(.985);}
  .unit-card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 110% -10%, hsl(var(--h) 100% 94%) 0%, transparent 62%);
  }
  .unit-top{display:flex;align-items:center;gap:8px;position:relative;}
  .unit-emoji{
    width:clamp(38px,9vw,46px);height:clamp(38px,9vw,46px);border-radius:14px;
    display:grid;place-items:center;font-size:clamp(1.15rem,3.4vw,1.4rem);
    background:linear-gradient(135deg,hsl(var(--h) 100% 93%),hsl(var(--h) 100% 88%));
    box-shadow:0 3px 0 hsl(var(--h) 60% 85%);
  }
  .unit-meta{min-width:0;}
  .unit-tag{font-size:clamp(.62rem,1.8vw,.72rem);font-weight:800;color:hsl(var(--h) 55% 45%);letter-spacing:.4px;}
  .unit-name{font-size:clamp(.86rem,2.4vw,1rem);font-weight:800;line-height:1.28;margin-top:2px;}
  .unit-cn{font-size:clamp(.68rem,1.9vw,.8rem);color:var(--ink-2);margin-top:3px;}
  .unit-pony{
    flex:none;width:clamp(48px,12vw,68px);margin-left:auto;align-self:center;
    opacity:.96;pointer-events:none;filter:drop-shadow(0 5px 9px rgba(150,120,170,.16));
    transform:translateY(4px);
  }
  .unit-progress{position:relative;margin-top:10px;height:9px;border-radius:99px;background:#f2eef8;overflow:hidden;}
  .unit-progress i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,hsl(var(--h) 95% 78%),hsl(var(--h) 90% 62%));transition:width .4s;}
  .unit-foot{display:flex;justify-content:space-between;align-items:center;position:relative;
    margin-top:7px;font-size:clamp(.64rem,1.8vw,.74rem);color:var(--ink-2);font-weight:700;}

  /* 特殊入口 */
  .quick-row{display:grid;gap:clamp(10px,2.2vw,16px);margin-top:clamp(12px,2.6vw,18px);
    grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));}
  .quick-card{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 16px;
    box-shadow:var(--shadow);cursor:pointer;border:3px solid transparent;transition:.18s;
  }
  .quick-card:hover{transform:translateY(-3px);border-color:var(--blue-l);}
  .quick-card.wrong{border-left:8px solid #ffb3b3;}
  .quick-icon{font-size:1.7rem;flex:none;width:46px;height:46px;border-radius:14px;
    display:grid;place-items:center;background:#f6f2ff;}
  .quick-card.wrong .quick-icon{background:#fff0f0;}
  .quick-info{flex:1;min-width:0;}
  .quick-info h3{font-size:clamp(.86rem,2.3vw,.98rem);}
  .quick-info p{font-size:clamp(.68rem,1.9vw,.8rem);color:var(--ink-2);margin-top:3px;}
  .quick-arrow{color:var(--pink);font-weight:800;font-size:1.1rem;}

  .tips{
    margin-top:clamp(16px,3.4vw,24px);text-align:center;font-size:clamp(.72rem,2vw,.86rem);
    color:#948da8;background:#fff8fc;border:2px dashed var(--pink-l);border-radius:18px;
    padding:12px;line-height:1.6;
  }
  .footer{text-align:center;margin-top:22px;font-size:clamp(.68rem,1.9vw,.8rem);color:#b6b0c6;}

  /* ============================================================
     顶栏 / 标签
     ============================================================ */
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:clamp(12px,2.6vw,18px);}
  .back{
    flex:none;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;
    font-size:clamp(.76rem,2.1vw,.86rem);box-shadow:0 4px 0 #ece7f5;transition:.14s;
  }
  .back:active{transform:translateY(3px);box-shadow:none;}
  .topbar h2{font-size:clamp(1rem,2.9vw,1.3rem);display:flex;align-items:center;gap:6px;min-width:0;}
  .topbar h2 .top-pony{width:clamp(34px,8vw,46px);flex:none;transform:translateY(4px);}

  .tabs{
    display:grid;gap:8px;margin-bottom:clamp(12px,2.6vw,18px);
    grid-template-columns:repeat(3,1fr);
  }
  .tab{
    display:flex;align-items:center;justify-content:center;gap:5px;
    padding:clamp(9px,2.2vw,12px) 4px;border-radius:16px;font-weight:800;
    font-size:clamp(.66rem,1.9vw,.85rem);color:#a49dba;background:#fff;
    box-shadow:0 4px 0 #ece7f5;transition:.14s;white-space:nowrap;
  }
  .tab .tab-ic{font-size:1.1em;}
  .tab.active{background:linear-gradient(135deg,#ffa8c5,#ff8fb1);color:#fff;box-shadow:0 4px 0 #ef7ba1;}
  .tab:active{transform:translateY(2px);box-shadow:none;}

  /* ============================================================
     学一学
     ============================================================ */
  .learn-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
    font-size:clamp(.72rem,2vw,.84rem);color:var(--ink-2);margin-bottom:12px;padding:0 4px;flex-wrap:wrap;}
  .learn-grid{display:grid;gap:clamp(8px,2vw,14px);
    grid-template-columns:repeat(auto-fill,minmax(min(100%,clamp(112px,20vw,150px)),1fr));}
  .word-card{
    position:relative;background:#fff;border-radius:20px;padding:12px 8px 11px;text-align:center;
    box-shadow:var(--shadow);border:3px solid transparent;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:.16s;
    -webkit-user-select:none;user-select:none;
  }
  .word-card:hover{transform:translateY(-3px);border-color:var(--blue-l);}
  .word-card:active{transform:scale(.97);}
  .word-card.learned{background:linear-gradient(180deg,#fffdf6,#fff8ea);border-color:#ffe3a3;}
  .word-card.learned::after{
    content:'✓';position:absolute;top:6px;right:8px;width:22px;height:22px;line-height:22px;
    border-radius:50%;background:var(--green);color:#fff;font-size:.72rem;font-weight:800;
  }
  .sticker{
    width:clamp(52px,15vw,68px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    font-size:clamp(1.5rem,5vw,2.05rem);line-height:1;
    background:radial-gradient(circle at 32% 26%,#fff 0%,hsl(var(--h,340) 100% 93%) 62%,hsl(var(--h,340) 95% 86%) 100%);
    box-shadow:inset 0 -3px 0 hsl(var(--h,340) 60% 84%), 0 3px 6px rgba(150,120,170,.14);
  }
  .sticker .num{font-size:1.25em;font-weight:800;color:var(--pink-d);}
  .word-card .en{font-size:clamp(.84rem,2.4vw,.98rem);font-weight:800;color:#514a66;line-height:1.2;word-break:break-word;}
  .word-card .zh{font-size:clamp(.66rem,1.9vw,.76rem);color:#a49dba;line-height:1.25;min-height:1.2em;}
  .word-card.learned .zh{color:#e08a27;font-weight:700;}
  .spk{position:absolute;top:6px;left:8px;font-size:.8rem;opacity:.45;}

  .sent-box{margin-top:clamp(16px,3.4vw,24px);background:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow);padding:clamp(14px,3vw,20px);}
  .sent-box h4{font-size:clamp(.84rem,2.3vw,.96rem);color:#6b6386;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
  .sent-list{display:grid;gap:8px;}
  .sent{
    display:flex;align-items:center;gap:10px;background:#fbf9ff;border-radius:14px;padding:10px 12px;
    cursor:pointer;transition:.15s;border:2px solid transparent;
  }
  .sent:hover{border-color:var(--blue-l);background:#f7fbff;}
  .sent .s-en{font-weight:800;font-size:clamp(.76rem,2.1vw,.9rem);line-height:1.35;flex:1;min-width:0;word-break:break-word;}
  .sent .s-zh{font-size:clamp(.66rem,1.9vw,.76rem);color:var(--ink-2);line-height:1.35;display:block;margin-top:2px;font-weight:600;}
  .sent .s-spk{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    background:#fff;box-shadow:0 2px 0 #e9e3f6;font-size:.85rem;}

  /* ============================================================
     测一测
     ============================================================ */
  .quiz-bar{display:flex;justify-content:space-between;font-size:clamp(.72rem,2vw,.84rem);
    color:var(--ink-2);font-weight:800;margin-bottom:12px;padding:0 4px;}
  .quiz-card{background:#fff;border-radius:var(--radius);padding:clamp(18px,4vw,30px);
    text-align:center;box-shadow:var(--shadow);}
  .quiz-sticker{
    width:clamp(84px,22vw,116px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;
    font-size:clamp(2.4rem,8vw,3.4rem);line-height:1;
    background:radial-gradient(circle at 32% 26%,#fff 0%,hsl(var(--h,340) 100% 94%) 62%,hsl(var(--h,340) 95% 87%) 100%);
    box-shadow:inset 0 -4px 0 hsl(var(--h,340) 60% 85%),0 6px 14px rgba(150,120,170,.16);
  }
  .quiz-sticker .num{font-size:1.2em;font-weight:800;color:var(--pink-d);}
  .quiz-zh{font-size:clamp(1rem,2.9vw,1.25rem);font-weight:800;color:#e08a27;margin-top:12px;min-height:1.4em;}
  .quiz-q{font-size:clamp(.7rem,1.9vw,.84rem);color:var(--ink-2);margin:10px 0 14px;}
  .options{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));}
  .opt{
    padding:clamp(12px,2.6vw,16px) 8px;border:3px solid var(--blue-l);border-radius:16px;
    background:#fbfdff;font-size:clamp(.9rem,2.5vw,1.08rem);font-weight:800;color:var(--ink);
    box-shadow:0 4px 0 #e3f0fb;transition:.14s;word-break:break-word;line-height:1.3;min-height:48px;
  }
  .opt:hover{transform:translateY(-2px);border-color:var(--blue);}
  .opt:active{transform:translateY(2px);box-shadow:none;}
  .opt.correct{background:#e6fbef;border-color:var(--green);color:var(--green-d);box-shadow:0 4px 0 #b6ebcd;}
  .opt.wrong{background:#ffecec;border-color:#ff9a9a;color:#e25656;box-shadow:0 4px 0 #ffd0d0;}

  /* 小测 · 多种题型 */
  .q-type{font-size:clamp(.6rem,1.7vw,.74rem);background:var(--pink-l);color:var(--pink-d);
    padding:3px 10px;border-radius:99px;white-space:nowrap;line-height:1.5;}
  .quiz-en{font-size:clamp(1.1rem,3.2vw,1.5rem);font-weight:800;color:var(--blue-d);
    margin-top:12px;min-height:1.4em;word-break:break-word;line-height:1.3;}
  .q-spk{margin:10px auto 2px;display:inline-flex;align-items:center;gap:6px;
    font-size:clamp(.78rem,2.1vw,.92rem);font-weight:800;color:var(--blue-d);
    background:#eaf6ff;border:2px solid var(--blue-l);border-radius:99px;padding:7px 14px;
    transition:.14s;}
  .q-spk:active{transform:translateY(2px);}
  .listen-btn{width:clamp(116px,30vw,152px);height:clamp(116px,30vw,152px);border-radius:50%;
    margin:8px auto 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:clamp(2.4rem,7vw,3rem);line-height:1;
    background:radial-gradient(circle at 32% 26%,#fff 0%,#eaf6ff 62%,#dcefff 100%);
    box-shadow:inset 0 -4px 0 #cbe6fa,0 6px 14px rgba(120,170,220,.2);
    animation:bob 2s ease-in-out infinite;transition:.14s;}
  .listen-btn span{font-size:clamp(.66rem,1.8vw,.78rem);font-weight:800;color:var(--blue-d);}
  .listen-btn:active{transform:scale(.95);}
  .quiz-sticker.big{width:clamp(104px,27vw,142px);font-size:clamp(2.8rem,9vw,4rem);}
  .q-reveal{min-height:1.3em;margin-top:12px;font-size:clamp(.74rem,2vw,.88rem);
    color:var(--ink-2);font-weight:800;}
  .q-reveal b{color:var(--ink);}
  .q-combo{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:99px;
    background:linear-gradient(135deg,#fff3d6,#ffe49c);color:#c07b12;font-weight:800;
    font-size:clamp(.72rem,2vw,.86rem);animation:pop .38s;}

  /* ============================================================
     拼一拼
     ============================================================ */
  .spell-head{text-align:center;}
  .spell-sticker{
    width:clamp(76px,20vw,104px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;
    font-size:clamp(2.1rem,7vw,2.9rem);
    background:radial-gradient(circle at 32% 26%,#fff 0%,hsl(var(--h,340) 100% 94%) 62%,hsl(var(--h,340) 95% 87%) 100%);
    box-shadow:inset 0 -4px 0 hsl(var(--h,340) 60% 85%);
  }
  .spell-sticker .num{font-size:1.2em;font-weight:800;color:var(--pink-d);}
  .spell-zh{font-size:clamp(.98rem,2.8vw,1.18rem);font-weight:800;color:#e08a27;margin-top:10px;min-height:1.4em;}
  .spell-tip{font-size:clamp(.7rem,1.9vw,.82rem);color:var(--ink-2);text-align:center;margin:8px 0 12px;}
  .spell-hint{text-align:center;font-size:clamp(.8rem,2.2vw,.92rem);font-weight:800;color:#e08a27;min-height:1.6em;margin-bottom:6px;}
  .spell-input-wrap{display:flex;justify-content:center;margin-bottom:14px;}
  .spell-input{
    width:min(100%,420px);padding:clamp(12px,2.8vw,16px) 16px;font-size:clamp(1.1rem,3.2vw,1.35rem);
    text-align:center;letter-spacing:1px;border:3px solid var(--blue-l);border-radius:18px;
    background:#fbfdff;color:var(--ink);outline:none;transition:.15s;
  }
  .spell-input::placeholder{color:#c8c2d8;letter-spacing:1px;font-size:clamp(.85rem,2.3vw,1rem);}
  .spell-input:focus{border-color:var(--pink);background:#fff8fc;box-shadow:0 0 0 4px var(--pink-l);}
  .spell-input.correct{border-color:var(--green);background:#e6fbef;color:var(--green-d);}
  .spell-input.wrong{border-color:#ff9a9a;background:#ffecec;color:#e25656;animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .spell-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}

  /* ============================================================
     拖一拖
     ============================================================ */
  .drag-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
    font-size:clamp(.72rem,2vw,.84rem);color:var(--ink-2);font-weight:800;margin-bottom:10px;padding:0 4px;}
  .drag-bar .unit-chip{background:#fff;border-radius:99px;padding:5px 11px;box-shadow:0 3px 0 #ece7f5;color:#6b6386;}
  .drag-hint{font-size:clamp(.68rem,1.9vw,.8rem);color:var(--ink-2);text-align:center;margin-bottom:12px;}
  .slots{display:grid;gap:10px;grid-template-columns:1fr 1fr;}
  .slot{
    position:relative;min-height:clamp(88px,23vw,110px);border-radius:18px;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:3px dashed #cdd8ff;box-shadow:0 4px 0 #dde4f8;transition:.16s;padding:8px;
    -webkit-user-select:none;user-select:none;
  }
  .slot .tag{position:absolute;top:-9px;left:10px;font-size:clamp(.58rem,1.6vw,.68rem);
    background:#e3ecff;color:#6a6fbe;padding:1px 8px;border-radius:99px;font-weight:700;}
  .slot .s-emoji{font-size:clamp(1.4rem,4.6vw,1.9rem);line-height:1;}
  .slot .s-zh{font-size:clamp(.76rem,2.1vw,.9rem);font-weight:800;color:#4a4458;text-align:center;line-height:1.25;}
  .slot .s-en{font-size:clamp(.95rem,2.7vw,1.15rem);font-weight:800;color:var(--green-d);}
  .slot.dropok{border:3px solid #4cd37f;background:#eafff2;box-shadow:0 4px 0 #b6ebcd;}
  .slot.dropok .tag{background:#d1f7e0;color:var(--green-d);}
  .slot.dropbad{border:3px dashed #ff8a8a;background:#fff3f3;animation:shake .3s;}
  .slot.hover{border-style:solid;border-color:var(--blue);background:#f5fbff;transform:translateY(-2px);}
  .pool{
    display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
    margin:clamp(14px,3vw,20px) 0 12px;min-height:56px;
  }
  .chip{
    background:linear-gradient(180deg,#ffe873,#ffdf4d);padding:clamp(10px,2.4vw,13px) clamp(12px,3vw,16px);
    border-radius:14px;font-size:clamp(.9rem,2.5vw,1.1rem);font-weight:800;color:#5a4a20;
    box-shadow:0 4px 0 #e0c34a;border:2px solid #ffdf5e;
    -webkit-user-select:none;user-select:none;touch-action:none;
    transition:transform .12s,opacity .2s,box-shadow .12s;min-height:46px;display:flex;align-items:center;
  }
  .chip:active{transform:scale(1.04);}
  .chip.selected{outline:4px solid #7dc4f5;outline-offset:2px;transform:translateY(-3px);}
  .chip.placed{opacity:0;pointer-events:none;transform:scale(.85);}
  .chip.fly{position:fixed;z-index:999;pointer-events:none;box-shadow:0 12px 26px rgba(0,0,0,.22);
    background:linear-gradient(180deg,#ffe873,#ffd12f);transform:scale(1.08) rotate(-2deg);}
  .chip.shake{animation:shake .3s;}
  .drag-actions{display:flex;gap:10px;margin-top:10px;}
  .drag-actions .btn{flex:1;}


  /* ============================================================
     字母拼拼乐
     ============================================================ */
  .lg-head{text-align:center;margin-bottom:6px;}
  .lg-sticker{
    width:clamp(64px,17vw,88px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;
    font-size:clamp(1.8rem,6vw,2.5rem);line-height:1;
    background:radial-gradient(circle at 32% 26%,#fff 0%,hsl(var(--h,340) 100% 94%) 62%,hsl(var(--h,340) 95% 87%) 100%);
    box-shadow:inset 0 -4px 0 hsl(var(--h,340) 60% 85%),0 5px 12px rgba(150,120,170,.14);
  }
  .lg-sticker .num{font-size:1.15em;font-weight:800;color:var(--pink-d);}
  .lg-zh{font-size:clamp(.95rem,2.7vw,1.15rem);font-weight:800;color:#e08a27;margin-top:8px;min-height:1.3em;}
  .lg-len{font-size:clamp(.68rem,1.9vw,.8rem);color:var(--ink-2);margin-top:4px;}
  .lg-slots{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.6vw,10px);margin:14px 0 4px;}
  .lg-slot{
    width:clamp(42px,10.5vw,58px);height:clamp(50px,12.5vw,68px);border-radius:14px;
    background:#fff;border:3px dashed #cdd8ff;box-shadow:0 4px 0 #dde4f8;
    display:grid;place-items:center;font-size:clamp(1.15rem,3.8vw,1.65rem);font-weight:800;
    color:#4a4458;transition:.14s;padding:0;
  }
  .lg-slot.filled{border-style:solid;border-color:hsl(var(--h,340) 70% 80%);background:hsl(var(--h,340) 100% 97%);}
  .lg-slot.next{border-color:var(--pink);box-shadow:0 0 0 4px var(--pink-l),0 4px 0 #dde4f8;}
  .lg-slot.ok{border-color:var(--green);background:#eafff2;color:var(--green-d);}
  .lg-slot.bad{border-color:#ff8a8a;background:#fff1f1;animation:shake .3s;}
  .lg-pool{
    display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.6vw,10px);
    margin:12px 0 14px;min-height:clamp(52px,13vw,70px);
  }
  .lg-tile{
    width:clamp(42px,10.5vw,58px);height:clamp(50px,12.5vw,68px);border-radius:14px;
    display:grid;place-items:center;font-size:clamp(1.15rem,3.8vw,1.65rem);font-weight:800;
    color:#5a4a20;background:linear-gradient(180deg,#ffe873,#ffdf4d);
    box-shadow:0 4px 0 #e0c34a;border:2px solid #ffdf5e;
    -webkit-user-select:none;user-select:none;touch-action:none;cursor:grab;
    transition:transform .12s,opacity .2s;
  }
  .lg-tile:active{transform:scale(1.05);}
  .lg-tile.used{opacity:0;pointer-events:none;}
  .lg-tile.hint{animation:pop .45s;outline:4px solid #7dc4f5;outline-offset:2px;}
  .lg-tile.fly{
    position:fixed;z-index:999;pointer-events:none;
    box-shadow:0 12px 26px rgba(0,0,0,.22);transform:scale(1.08) rotate(-3deg);
  }
  .lg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;}
  .lg-actions .btn{flex:1 1 120px;min-width:110px;padding-left:10px;padding-right:10px;}

  /* ============================================================
     通用按钮 / 结果
     ============================================================ */
  .btn{
    padding:clamp(11px,2.6vw,14px) clamp(16px,4vw,24px);border-radius:16px;font-weight:800;
    font-size:clamp(.82rem,2.3vw,.95rem);background:#fff;color:var(--ink);
    box-shadow:0 4px 0 #e8e2f2;transition:.14s;min-height:46px;
  }
  .btn.primary{background:linear-gradient(135deg,#ffa8c5,#ff8fb1);color:#fff;box-shadow:0 4px 0 #ef7ba1;}
  .btn.go{background:linear-gradient(135deg,#7cc0ff,#7a9dff);color:#fff;box-shadow:0 4px 0 #5f7de0;}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .result-card{
    position:relative;overflow:hidden;background:#fff;border-radius:28px;
    padding:clamp(24px,5vw,38px) clamp(16px,4vw,24px);text-align:center;box-shadow:var(--shadow);
  }
  .result-card .r-mascot{width:clamp(96px,24vw,150px);margin:0 auto 6px;display:block;
    filter:drop-shadow(0 10px 16px rgba(150,110,180,.18));animation:bob 3s ease-in-out infinite;}
  .result-card h3{font-size:clamp(1.05rem,3vw,1.35rem);margin:6px 0;}
  .result-card p{color:var(--ink-2);font-size:clamp(.8rem,2.2vw,.95rem);line-height:1.6;}
  .result-btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
  .pop{animation:pop .38s;}

  /* 错题本 */
  .wrong-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    flex-wrap:wrap;margin-bottom:14px;font-size:clamp(.72rem,2vw,.86rem);color:var(--ink-2);
    font-weight:800;padding:0 4px;}
  .wrong-list{display:grid;gap:10px;}
  .wrong-card{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;
    padding:12px 14px;box-shadow:var(--shadow);border-left:7px solid #ffb3b3;}
  .wrong-card .wc-emoji{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;
    font-size:1.6rem;background:#fff5f5;}
  .wrong-card .wc-emoji .num{font-size:1.2em;font-weight:800;color:var(--pink-d);}
  .wc-info{flex:1;min-width:0;}
  .wc-en{font-size:clamp(.86rem,2.4vw,1rem);font-weight:800;word-break:break-word;}
  .wc-meta{font-size:clamp(.64rem,1.8vw,.74rem);color:var(--ink-2);margin-top:3px;line-height:1.4;}
  .wc-btns{margin-left:auto;display:flex;gap:8px;flex:none;}
  .mini{width:44px;height:44px;border-radius:14px;background:#f4f0fb;font-size:1rem;
    box-shadow:0 3px 0 #e5def3;transition:.12s;display:grid;place-items:center;}
  .mini.ok{background:#e6fbef;box-shadow:0 3px 0 #b6ebcd;}
  .mini:active{transform:translateY(3px);box-shadow:none;}
  .empty-box{text-align:center;padding:clamp(32px,7vw,52px) 18px;background:#fff;
    border-radius:26px;box-shadow:var(--shadow);}
  .empty-box .big{font-size:clamp(2.6rem,9vw,3.6rem);}
  .empty-box h3{margin-top:10px;font-size:clamp(.98rem,2.8vw,1.15rem);}
  .empty-box p{color:var(--ink-2);font-size:clamp(.78rem,2.1vw,.9rem);margin-top:8px;line-height:1.6;}

  /* toast */
  #toast{
    position:fixed;left:50%;top:38%;transform:translateX(-50%);z-index:1000;
    padding:13px 24px;border-radius:16px;font-size:clamp(.9rem,2.5vw,1.06rem);font-weight:800;
    background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);display:none;text-align:center;
    max-width:min(84vw,420px);pointer-events:none;
  }

  /* ============================================================
     响应式：平板 / 桌面
     ============================================================ */
  @media (min-width:641px){
    .hero{padding-top:8px;}
    .slots{grid-template-columns:repeat(4,1fr);}
    .slot{min-height:120px;}
    .tabs{grid-template-columns:repeat(5,1fr);}
    .learn-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  }
  @media (min-width:960px){
    .unit-grid{grid-template-columns:repeat(3,1fr);}
  }
  @media (min-width:1024px){
    .hero h1{letter-spacing:1px;}
    .slot{min-height:132px;}
  }
  @media (max-width:400px){
    .slots{grid-template-columns:1fr 1fr;}
    .unit-pony{width:56px;}
    .tab .tab-ic{font-size:1em;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>

   ===================================================================== */

const WRONG_KEY = 'pep3u_wrong_2024';

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function isNum(s){ return /^\d+$/.test(String(s)); }
function emojiHtml(em){
  return isNum(em)
    ? `<span class="num">${em}</span>`
    : `<span class="emoji">${em}</span>`;
}
function normWord(s){
  return String(s).toLowerCase().replace(/[\s\-'’?!.,]/g,'');
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

/* 发音 */
function speak(text){
  if(!('speechSynthesis' in window)) return false;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1.05;
    const vs = window.speechSynthesis.getVoices();
    const v = vs.find(x=>/en[-_]US/i.test(x.lang)) || vs.find(x=>/^en/i.test(x.lang));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
    return true;
  }catch(e){ return false; }
}

/* 学习进度 */
let learned = {};
try{ learned = JSON.parse(localStorage.getItem(LEARN_KEY) || '{}'); }catch(e){ learned = {}; }
function isLearned(unitId, en){ return (learned[unitId] || []).includes(en); }
function markLearned(unitId, en){
  learned[unitId] = learned[unitId] || [];
  if(!learned[unitId].includes(en)){
    learned[unitId].push(en);
    try{ localStorage.setItem(LEARN_KEY, JSON.stringify(learned)); }catch(e){}
  }
}
function learnedCount(unitId){ return (learned[unitId] || []).length; }

/* 错题本 */
let wrongBook = {};
try{ wrongBook = JSON.parse(localStorage.getItem(WRONG_KEY) || '{}'); }catch(e){ wrongBook = {}; }
function saveWrong(){ try{ localStorage.setItem(WRONG_KEY, JSON.stringify(wrongBook)); }catch(e){} }
function addWrong(word, unit){
  const key = word.en;
  if(!wrongBook[key]){
    wrongBook[key] = {
      en: word.en, zh: word.zh || '', em: word.em || '📘',
      unitId: unit ? unit.id : (word.unitId || ''),
      unitName: unit ? (unit.no + ' ' + unit.name) : (word.unitName || ''),
      hue: unit ? unit.hue : (word.hue || 340),
      count: 0
    };
  }
  wrongBook[key].count = (wrongBook[key].count || 0) + 1;
  saveWrong();
}
function removeWrong(en){ if(wrongBook[en]){ delete wrongBook[en]; saveWrong(); } }
function wrongCount(){ return Object.keys(wrongBook).length; }
function wrongList(){ return Object.values(wrongBook).sort((a,b)=>(b.count||0)-(a.count||0)); }

let quizState = null;

/* 小测题型：错题小测随机混合，单元测一测保持"看中文选英文" */
const QUIZ_TYPES = ['zh2en','en2zh','listen','emoji'];
const QUIZ_TYPE_LABEL = {
  zh2en:'看中文 · 选英文', en2zh:'看英文 · 选中文',
  listen:'听发音 · 选单词', emoji:'看图 · 猜单词'
};

function quizTypeSequence(n){
  const seq = [];
  while(seq.length < n) seq.push(...shuffle(QUIZ_TYPES));
  return seq.slice(0, n);
}

/* 按字段生成 4 个选项（field: en / zh），正确项带 _right 标记 */
function makeOptions(correct, pool, field){
  field = field || 'en';
  const right = correct[field] || correct.en || correct.zh || '?';
  const seen = new Set([right]);
  const others = [];
  shuffle(pool).forEach(w=>{
    const v = w[field];
    if(v && !seen.has(v)){ seen.add(v); others.push({_opt:v}); }
  });
  return shuffle([{_opt:right, _right:true}, ...others.slice(0,3)]);
}

function startQuiz(opts){
  const words = shuffle(opts.words.slice());
  quizState = {
    list: words,
    types: opts.variety ? quizTypeSequence(words.length) : null,
    i:0, score:0, combo:0, locked:false,
    pool: opts.pool, container: opts.container,
    mode: opts.mode || 'unit',
    unit: opts.unit || null,
    isMix: !!opts.isMix,
    variety: !!opts.variety
  };
  drawQuiz();
}

/* 答题后是否仍停留在当前小测（修复：不能只看 activeTabKey） */
function quizStillActive(s){
  if(!s || !s.container || !document.body.contains(s.container)) return false;
  if(s.mode === 'wrong') return route.name === 'wrongQuiz';
  return route.name === 'unit' && activeTabKey === 'quiz';
}

function drawQuiz(){
  const s = quizState, c = s && s.container;
  if(!quizStillActive(s)) return;
  if(s.i >= s.list.length){ drawQuizResult(); return; }

  const w = s.list[s.i];
  const type = s.variety ? s.types[s.i] : 'zh2en';
  const hue = s.unit ? s.unit.hue : (w.hue || 340);
  const opts = makeOptions(w, s.pool, type === 'en2zh' ? 'zh' : 'en');
  const myI = s.i;

  let headHtml, prompt;
  if(type === 'en2zh'){
    headHtml = `<div class="quiz-sticker">${emojiHtml(w.em)}</div>
      <div class="quiz-en">${esc(w.en)}</div>
      <button class="q-spk" id="qSpk" type="button">🔊 听一听</button>`;
    prompt = '选出正确的中文意思 👇';
  }else if(type === 'listen'){
    headHtml = `<button class="listen-btn" id="qSpk" type="button">🔊<span>点我听发音</span></button>`;
    prompt = isNum(w.em) ? '听一听，选出你听到的数字 👇' : '听一听，选出你听到的单词 👇';
  }else if(type === 'emoji'){
    headHtml = `<div class="quiz-sticker big">${emojiHtml(w.em)}</div>`;
    prompt = isNum(w.em) ? '看数字猜一猜，选出正确的英文 👇' : '看图猜一猜，选出正确的英文 👇';
  }else{
    headHtml = `<div class="quiz-sticker">${emojiHtml(w.em)}</div>
      <div class="quiz-zh">${esc(w.zh)}</div>`;
    prompt = '选出正确的英文 👇';
  }

  c.innerHTML = `
    <div class="quiz-bar">
      <span>第 ${s.i+1} / ${s.list.length} 题</span>
      <span class="q-type">${QUIZ_TYPE_LABEL[type]}</span>
      <span>⭐ ${s.score} 分</span>
    </div>
    <div class="quiz-card" style="--h:${hue}">
      ${headHtml}
      <div class="quiz-q">${prompt}</div>
      <div class="options">
        ${opts.map((o,idx)=>`<button class="opt" data-i="${idx}" type="button">${esc(o._opt)}</button>`).join('')}
      </div>
      <div class="q-reveal" id="qReveal"></div>
      <div id="qCombo"></div>
    </div>`;

  const spk = document.getElementById('qSpk');
  if(spk) spk.onclick = (e)=>{ e.stopPropagation(); speak(w.en); };
  if(type === 'listen'){
    setTimeout(()=>{ if(quizStillActive(s) && s.i === myI && !s.locked) speak(w.en); }, 300);
  }

  c.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = () => {
      if(s.locked || !quizStillActive(s)) return;
      s.locked = true;
      const ok = !!opts[+btn.dataset.i]._right;
      const reveal = document.getElementById('qReveal');
      const comboBox = document.getElementById('qCombo');
      if(ok){
        btn.classList.add('correct');
        s.score++; s.combo++;
        if(s.mode === 'wrong') removeWrong(w.en);
        if(reveal) reveal.innerHTML = '✅ 答对啦，真棒！';
        if(comboBox && s.combo >= 3) comboBox.innerHTML = `<span class="q-combo">🔥 连对 ${s.combo} 题！</span>`;
      }else{
        btn.classList.add('wrong');
        c.querySelectorAll('.opt').forEach((b,bi)=>{ if(opts[bi]._right) b.classList.add('correct'); });
        s.combo = 0;
        addWrong(w, s.unit);
        if(reveal) reveal.innerHTML = `正确答案：<b>${esc(w.en)}</b> ${esc(w.zh)}`;
      }
      speak(w.en);
      setTimeout(()=>{
        if(!quizStillActive(s) || s.i !== myI) return;
        s.i++; s.locked = false; drawQuiz();
      }, ok ? 800 : 1600);
    };
  });
}

function drawQuizResult(){

   9. 拼一拼
   ===================================================================== */
let spell = null;

function startSpell(unit){
  spell = { unit, list: shuffle(unit.words.slice()), i:0, score:0, wrongRecorded:false, locked:false };
  drawSpell();
}

function drawSpell(){
  const body = document.getElementById('tabBody');
  if(!body) return;
  const s = spell;
  if(s.i >= s.list.length){ drawSpellResult(); return; }
  const w = s.list[s.i];
  const hue = s.unit ? s.unit.hue : 340;
  s.wrongRecorded = false; s.locked = false;

  body.innerHTML = `
    <div class="quiz-bar">
      <span>第 ${s.i+1} / ${s.list.length} 题</span>
      <span>⭐ ${s.score} 分</span>
    </div>
    <div class="spell-head" style="--h:${hue}">
      <div class="spell-sticker">${emojiHtml(w.em)}</div>
      <div class="spell-zh">${esc(w.zh)}</div>
    </div>
    <div class="spell-tip">在下面的方框里输入英文（空格、标点可以不打哦）</div>
    <div class="spell-hint" id="spellHint"></div>
    <div class="spell-input-wrap">
      <input id="spellInput" class="spell-input" type="text" placeholder="type here…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
    </div>
    <div class="spell-actions">
      <button class="btn primary" id="checkBtn">✓ 确认</button>
      <button class="btn" id="hearBtn">🔊 听发音</button>
      <button class="btn" id="showBtn">👀 看答案</button>
    </div>`;

  const input = document.getElementById('spellInput');
  const hint = document.getElementById('spellHint');

  const check = () => {
    if(s.locked) return;
    if(!input.value.trim()){ input.focus(); return; }
    if(normWord(input.value) === normWord(w.en)){
      s.locked = true; s.score++;
      input.classList.remove('wrong'); input.classList.add('correct');
      input.disabled = true;
      hint.textContent = '✅ 太棒了，完全正确！';
      speak(w.en);
      setTimeout(()=>{ if(activeTabKey !== 'spell') return; s.i++; drawSpell(); }, 900);
    }else{
      input.classList.remove('correct'); input.classList.add('wrong');
      setTimeout(()=>input.classList.remove('wrong'), 400);
      input.value = ''; input.focus();
      if(!s.wrongRecorded){
        addWrong(w, s.unit);
        s.wrongRecorded = true;
        hint.textContent = '❌ 差一点点，再试一次吧！';
      }else{
        hint.textContent = '❌ 再想一想，注意每个字母哦～';
      }
    }
  };

  document.getElementById('checkBtn').onclick = check;
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); check(); } });
  document.getElementById('hearBtn').onclick = () => speak(w.en);
  document.getElementById('showBtn').onclick = () => {
    if(s.locked) return;
    s.locked = true;
    if(!s.wrongRecorded){ addWrong(w, s.unit); s.wrongRecorded = true; }
    input.classList.remove('correct'); input.classList.add('wrong');
    input.value = w.en; input.disabled = true;
    hint.textContent = `正确答案是：${w.en}`;
    speak(w.en);
    setTimeout(()=>{ if(activeTabKey !== 'spell') return; s.i++; drawSpell(); }, 1700);
  };
  setTimeout(()=>{ try{ input.focus(); }catch(e){} }, 80);
}

function drawSpellResult(){
  const body = document.getElementById('tabBody');
  const s = spell;
  const total = s.list.length;
  const pct = total ? s.score/total : 0;

  body.innerHTML = `
    <div class="result-card" style="--h:${s.unit?s.unit.hue:340}">
      <img class="r-mascot" src="${ART.cheer}" alt="">
      <h3>${pct>=0.9?'拼写小达人！':pct>=0.6?'表现不错哦！':'多练几次就熟练啦！'}</h3>
      <p>正确拼出 ${s.score} / ${total} 个词</p>

        <button class="btn" id="backLearn">📚 回去复习</button>
      </div>
    </div>`;

  document.getElementById('spellAgain').onclick = () => startSpell(s.unit);

/* =====================================================================
   10. 拖一拖（拖拽配对）
   ===================================================================== */
const DRAG_GROUP = 4;
let drag = null;
let dragEl = null;          // 正在拖的浮动副本
let dragChip = null;        // 被拖/被选中的 chip
let dragOffset = {x:0,y:0};
let dragMoved = false;
let dragStartPos = {x:0,y:0};

function dragSplit(words){
  const ws = shuffle(words.slice());
  const rounds = [];
  for(let i=0;i<ws.length;i+=DRAG_GROUP){
    const g = ws.slice(i,i+DRAG_GROUP);
    if(g.length === DRAG_GROUP) rounds.push(g);
  }
  return rounds;
}

function startDrag(unit){
  drag = {
    unit,
    rounds: dragSplit(unit.words),
    ri: 0,
    score: 0,
    placed: 0,
    locked: false
  };
  drawDrag();
}

function cleanupDrag(){
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  if(dragEl){ dragEl.remove(); dragEl = null; }
  dragChip = null;
  drag = null;
}

function drawDrag(){
  const body = document.getElementById('tabBody');
  if(!body) return;
  const d = drag;
  const unit = d.unit;

  if(!d.rounds.length || d.ri >= d.rounds.length){ drawDragResult(); return; }

  const group = d.rounds[d.ri];
  const hue = unit.hue || 340;
  d.placed = 0;
  d.locked = false;

  const slots = shuffle(group.slice());
  const chips = shuffle(group.slice());

  body.innerHTML = `
    <div class="drag-bar">
      <span class="unit-chip emoji">📖 ${unit.no} ${unit.name}</span>
      <span>第 ${d.ri+1} / ${d.rounds.length} 组 · ⭐ ${d.score} 分</span>
    </div>
    <div class="drag-hint">把下面的英文<b>拖到</b>对应的中文框里（也可以点英文，再点中文框）</div>
    <div class="slots" id="slots" style="--h:${hue}">
      ${slots.map(w=>`
        <div class="slot" data-en="${esc(w.en)}">
          <span class="tag">中文</span>
          <span class="s-emoji emoji">${emojiHtml(w.em)}</span>
          <span class="s-zh">${esc(w.zh)}</span>
        </div>`).join('')}
    </div>
    <div class="pool" id="pool">
      ${chips.map(w=>`<div class="chip" data-en="${esc(w.en)}">${esc(w.en)}</div>`).join('')}
    </div>
    <div class="drag-actions">
      <button class="btn" id="dragReset">🔄 重放本组</button>
      <button class="btn primary" id="dragNext">下一组 ➡️</button>
    </div>
    <div class="footer">🎧 配对成功会读给你听，跟着读一遍记得更牢～</div>`;

  const pool = document.getElementById('pool');
  pool.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('pointerdown', onDragStart);
  });

  const slotsWrap = document.getElementById('slots');
  slotsWrap.querySelectorAll('.slot').forEach(slot=>{
    slot.addEventListener('click', onSlotClick);
  });

  document.getElementById('dragReset').onclick = () => { drawDrag(); };
  document.getElementById('dragNext').onclick = () => {
    d.ri++;
    if(d.ri >= d.rounds.length) drawDragResult();
    else drawDrag();
  };
}

/* --- 拖拽：pointer 事件（鼠标 / 触屏统一） --- */
function onDragStart(e){
  if(drag && drag.locked) return;
  const chip = e.currentTarget;
  if(chip.classList.contains('placed')) return;
  e.preventDefault();
  dragChip = chip;
  dragMoved = false;
  dragStartPos = {x:e.clientX, y:e.clientY};
  const r = chip.getBoundingClientRect();
  dragOffset = {x:e.clientX - r.left, y:e.clientY - r.top};
  dragEl = chip.cloneNode(true);
  dragEl.classList.add('fly');
  dragEl.style.width = r.width + 'px';
  dragEl.style.height = r.height + 'px';
  document.body.appendChild(dragEl);
  moveDragEl(e.clientX, e.clientY);
  chip.style.opacity = '.25';
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  document.addEventListener('pointercancel', onDragEnd);
  try{ chip.setPointerCapture(e.pointerId); }catch(err){}
}

function moveDragEl(x, y){
  if(!dragEl) return;
  dragEl.style.left = (x - dragOffset.x) + 'px';
  dragEl.style.top  = (y - dragOffset.y) + 'px';
}

function onDragMove(e){
  if(!dragChip) return;
  e.preventDefault();
  if(Math.abs(e.clientX - dragStartPos.x) > 6 || Math.abs(e.clientY - dragStartPos.y) > 6) dragMoved = true;
  moveDragEl(e.clientX, e.clientY);
  highlightSlot(e.clientX, e.clientY);
}

function onDragEnd(e){
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
  document.removeEventListener('pointercancel', onDragEnd);
  if(!dragChip) return;
  const chip = dragChip;
  dragChip = null;
  if(dragEl){ dragEl.remove(); dragEl = null; }
  chip.style.opacity = '1';
  clearSlotHighlight();
  if(dragMoved){
    const slot = slotUnder(e.clientX, e.clientY);
    if(slot) checkDrop(chip, slot);
    else showToast('要拖到中文框里哦～', false);
  }else{
    // 没移动 → 点选模式：点一下英文，再点中文框
    toggleChipSelect(chip);
  }
}

function slotUnder(x, y){
  const slots = document.querySelectorAll('#slots .slot');
  for(const s of slots){
    const r = s.getBoundingClientRect();
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return s;
  }
  return null;
}

function highlightSlot(x, y){
  clearSlotHighlight();
  const s = slotUnder(x, y);
  if(s && !s.classList.contains('dropok')) s.classList.add('hover');
}

function clearSlotHighlight(){
  document.querySelectorAll('#slots .slot.hover').forEach(s=>s.classList.remove('hover'));
}

/* --- 点选模式 --- */
function toggleChipSelect(chip){
  if(!chip || chip.classList.contains('placed')) return;
  const was = chip.classList.contains('selected');
  document.querySelectorAll('.chip.selected').forEach(c=>c.classList.remove('selected'));
  if(!was){
    chip.classList.add('selected');
    showToast('再点一个中文框～', true);
  }
}

function onSlotClick(e){
  const slot = e.currentTarget;
  if(slot.classList.contains('dropok')) return;
  const chip = document.querySelector('.chip.selected');
  if(!chip) return;
  chip.classList.remove('selected');
  checkDrop(chip, slot);
}

function checkDrop(chip, slot){
  if(!drag || !chip || !slot) return;
  if(drag.locked) return;
  if(chip.classList.contains('placed')) return;
  const ok = chip.dataset.en === slot.dataset.en;

  if(ok){
    slot.classList.add('dropok');
    slot.querySelector('.tag').textContent = '✓ 答对';
    const zh = slot.querySelector('.s-zh');
    const en = document.createElement('span');
    en.className = 's-en';
    en.textContent = '✓ ' + chip.dataset.en;
    zh.style.display = 'none';
    slot.appendChild(en);
    chip.classList.add('placed');
    drag.placed++;
    drag.score += 10;
    speak(slot.dataset.en);
    showToast('✅ 配对成功！+10', true);
    refreshDragScore();
    if(drag.placed >= drag.rounds[drag.ri].length){
      drag.locked = true;
      setTimeout(()=>{
        if(!drag) return;
        drag.ri++;
        if(drag.ri >= drag.rounds.length) drawDragResult();
        else drawDrag();
      }, 750);
    }
  }else{
    slot.classList.add('dropbad');
    chip.classList.add('shake');
    setTimeout(()=>{ slot.classList.remove('dropbad'); chip.classList.remove('shake'); }, 420);
    showToast('❌ 不是这个，再试试～', false);
    speak(slot.dataset.en);
  }
}

function refreshDragScore(){
  const bar = document.querySelector('#tabBody .drag-bar span:last-child');
  if(bar && drag) bar.textContent = `第 ${drag.ri+1} / ${drag.rounds.length} 组 · ⭐ ${drag.score} 分`;
}

function drawDragResult(){
  const body = document.getElementById('tabBody');
  const d = drag;
  const total = d.rounds.length * DRAG_GROUP;
  body.innerHTML = `
    <div class="result-card" style="--h:${d.unit.hue || 340}">
      <img class="r-mascot" src="${ART.cheer}" alt="">
      <h3>拖完啦！得分 ${d.score} 分</h3>
      <p>共配对 ${total} 个单词 · 平均每组 10 分</p>
      <div class="result-btns">
        <button class="btn primary" id="dragAgain">🔄 再玩一次</button>
        <button class="btn" id="dragToQuiz">✏️ 去测一测</button>
      </div>
    </div>`;
  document.getElementById('dragAgain').onclick = () => { startDrag(d.unit); };
  document.getElementById('dragToQuiz').onclick = () => {
    activateTab('quiz');
    const unit = d.unit;
    cleanupDrag();
    startQuiz({ words:unit.words, pool: unit.words.length>=4?unit.words:ALL_WORDS,
      container: document.getElementById('tabBody'), mode:'unit', unit, isMix: unit.isMix });
  };
}


/* =====================================================================
   11. 字母拼拼乐（乱序字母拖拽拼单词）
   ===================================================================== */
const LG_MAX_EXTRA = 2;
let letter = null;
let lgDragTile = null;
let lgDragEl = null;
let lgMoved = false;
let lgStartPos = {x:0, y:0};
let lgOffset = {x:0, y:0};

function letterWords(unit){
  return (unit.words || []).filter(w => {
    const en = String(w.en || '');
    return /^[a-z]+$/i.test(en) && en.length >= 2 && en.length <= 9;
  });
}

function makeLetterTiles(word){
  const letters = word.toLowerCase().split('');
  const pool = letters.slice();
  const extra = Math.min(LG_MAX_EXTRA, Math.max(1, 10 - letters.length));
  const alphabet = 'abcdefghijklmnopqrstuvwxyz';
  let guard = 0;
  while(pool.length < letters.length + extra && guard++ < 200){
    const c = alphabet[Math.floor(Math.random() * 26)];
    if(!letters.includes(c)) pool.push(c);
  }
  return shuffle(pool).map((ch, i) => ({ch, id: i, used: false}));
}

function startLetter(unit){
  const pool = letterWords(unit);
  const list = shuffle(pool).slice(0, 10);
  if(!list.length){
    document.getElementById('tabBody').innerHTML =
      '<div class="result-card"><h3>这个单元的单词太短啦，换个单元试试吧～</h3></div>';
    return;
  }
  letter = {unit, list, i: 0, score: 0, perfect: 0, mistakes: 0, locked: false, state: null};
  drawLetter();
}

function lgPrepareWord(){
  const w = letter.list[letter.i];
  const word = w.en.toLowerCase();
  letter.slots = new Array(word.length).fill(null);
  letter.tiles = makeLetterTiles(word);
  letter.mistakes = 0;
  letter.state = null;
  drawLetter();
}

function drawLetter(){
  const body = document.getElementById('tabBody');
  if(!body || !letter) return;
  if(letter.i >= letter.list.length){ letterResult(); return; }
  if(!letter.slots){ lgPrepareWord(); return; }

  const w = letter.list[letter.i];
  const word = w.en.toLowerCase();
  const hue = letter.unit.hue || 340;
  const nextEmpty = letter.slots.indexOf(null);

  const slotsHtml = letter.slots.map((ch, idx) => {
    const cls = ['lg-slot'];
    if(ch) cls.push('filled');
    if(letter.state === 'ok') cls.push('ok');
    if(letter.state === 'bad') cls.push('bad');
    if(!letter.state && idx === nextEmpty) cls.push('next');
    return `<button class="${cls.join(' ')}" data-slot="${idx}" aria-label="第${idx + 1}个字母">${ch || ''}</button>`;
  }).join('');

  const tilesHtml = letter.tiles.map(t =>
    `<div class="lg-tile ${t.used ? 'used' : ''}" data-tile="${t.id}">${t.ch.toUpperCase()}</div>`
  ).join('');

  body.innerHTML = `
    <div class="quiz-bar">
      <span>第 ${letter.i + 1} / ${letter.list.length} 个单词</span>
      <span>⭐ ${letter.score} 分</span>
    </div>
    <div class="lg-head" style="--h:${hue}">
      <div class="lg-sticker">${emojiHtml(w.em)}</div>
      <div class="lg-zh">${esc(w.zh)}</div>
      <div class="lg-len">共 ${word.length} 个字母 · 把字母按顺序拖到上面的方框里</div>
    </div>
    <div class="lg-slots" id="lgSlots" style="--h:${hue}">${slotsHtml}</div>
    <div class="lg-pool" id="lgPool">${tilesHtml}</div>
    <div class="lg-actions">
      <button class="btn" id="lgShuffle">🔀 重排字母</button>
      <button class="btn" id="lgClear">🧹 清空</button>
      <button class="btn" id="lgHint">💡 提示</button>
      <button class="btn primary" id="lgCheck">✓ 确认</button>
    </div>
    <div class="footer">🎧 拼对会读给你听，跟着读一遍吧～</div>`;

  const pool = document.getElementById('lgPool');
  pool.querySelectorAll('.lg-tile').forEach(tile => {
    tile.addEventListener('pointerdown', lgDragStart);
  });

  body.querySelectorAll('.lg-slot').forEach(slot => {
    slot.addEventListener('click', () => lgRemoveFromSlot(Number(slot.dataset.slot)));
  });

  document.getElementById('lgShuffle').onclick = () => {
    letter.tiles = shuffle(letter.tiles);
    drawLetter();
  };
  document.getElementById('lgClear').onclick = () => {
    lgClearSlots();
    drawLetter();
  };
  document.getElementById('lgHint').onclick = () => {
    if(!letter || letter.state) return;
    const idx = letter.slots.indexOf(null);
    if(idx < 0) return;
    const need = word[idx];
    const tiles = [...document.querySelectorAll('.lg-tile')].filter(t => !t.classList.contains('used') && t.textContent.toLowerCase() === need);
    tiles.forEach(t => { t.classList.add('hint'); setTimeout(() => t.classList.remove('hint'), 900); });
    showToast(`第 ${idx + 1} 个字母是「${need.toUpperCase()}」`, true);
  };
  document.getElementById('lgCheck').onclick = () => lgCheck(false);
}

function lgDragStart(e){
  if(!letter || letter.state) return;
  const tile = e.currentTarget;
  if(tile.classList.contains('used')) return;
  e.preventDefault();
  const id = Number(tile.dataset.tile);
  const t = letter.tiles.find(x => x.id === id);
  if(!t || t.used) return;
  lgDragTile = id;
  lgMoved = false;
  lgStartPos = {x: e.clientX, y: e.clientY};
  const r = tile.getBoundingClientRect();
  lgOffset = {x: e.clientX - r.left, y: e.clientY - r.top};
  lgDragEl = tile.cloneNode(true);
  lgDragEl.classList.add('fly');
  lgDragEl.style.width = r.width + 'px';
  lgDragEl.style.height = r.height + 'px';
  document.body.appendChild(lgDragEl);
  lgMoveEl(e.clientX, e.clientY);
  tile.style.opacity = '.25';
  document.addEventListener('pointermove', lgDragMove);
  document.addEventListener('pointerup', lgDragEnd);
  document.addEventListener('pointercancel', lgDragEnd);
  try{ tile.setPointerCapture(e.pointerId); }catch(err){}
}

function lgMoveEl(x, y){
  if(!lgDragEl) return;
  lgDragEl.style.left = (x - lgOffset.x) + 'px';
  lgDragEl.style.top = (y - lgOffset.y) + 'px';
}

function lgDragMove(e){
  if(lgDragTile === null) return;
  e.preventDefault();
  if(Math.abs(e.clientX - lgStartPos.x) > 6 || Math.abs(e.clientY - lgStartPos.y) > 6) lgMoved = true;
  lgMoveEl(e.clientX, e.clientY);
}

function lgDragEnd(e){
  document.removeEventListener('pointermove', lgDragMove);
  document.removeEventListener('pointerup', lgDragEnd);
  document.removeEventListener('pointercancel', lgDragEnd);
  if(lgDragTile === null) return;
  const id = lgDragTile;
  lgDragTile = null;
  if(lgDragEl){ lgDragEl.remove(); lgDragEl = null; }
  document.querySelectorAll('.lg-tile').forEach(t => t.style.opacity = '');
  if(lgMoved){
    const slot = lgSlotUnder(e.clientX, e.clientY);
    if(slot) lgPlace(id, Number(slot.dataset.slot));
    else showToast('把字母拖到方框里哦～', false);
  }else{
    lgPlace(id, null);
  }
}

function lgSlotUnder(x, y){
  for(const s of document.querySelectorAll('.lg-slot')){
    const r = s.getBoundingClientRect();
    if(x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return s;
  }
  return null;
}

function lgPlace(tileId, slotIdx){
  if(!letter || letter.state) return;
  const t = letter.tiles.find(x => x.id === tileId);
  if(!t || t.used) return;
  if(slotIdx === null) slotIdx = letter.slots.indexOf(null);
  if(slotIdx < 0) return;
  if(letter.slots[slotIdx] !== null) return;
  letter.slots[slotIdx] = t.ch;
  t.used = true;
  t.slot = slotIdx;
  drawLetter();
  if(letter.slots.every(c => c !== null)) setTimeout(() => lgCheck(true), 180);
  else speakLetter(t.ch);
}

function lgRemoveFromSlot(idx){
  if(!letter || letter.state) return;
  if(idx < 0 || !letter.slots[idx]) return;
  const ch = letter.slots[idx];
  const t = letter.tiles.find(x => x.used && x.slot === idx && x.ch === ch);
  if(t){ t.used = false; t.slot = undefined; }
  letter.slots[idx] = null;
  drawLetter();
}

function lgClearSlots(){
  if(!letter || letter.state) return;
  letter.slots = letter.slots.map(() => null);
  letter.tiles.forEach(t => { t.used = false; t.slot = undefined; });
}

function lgCheck(auto){
  if(!letter || letter.state) return;
  if(letter.slots.some(c => c === null)){
    if(!auto) showToast('还有空格没填哦～', false);
    return;
  }
  const w = letter.list[letter.i];
  const answer = w.en.toLowerCase();
  const guess = letter.slots.join('');
  letter.locked = true;

  if(guess === answer){
    letter.state = 'ok';
    letter.score += letter.mistakes === 0 ? 10 : 5;
    if(letter.mistakes === 0) letter.perfect++;
    drawLetter();
    speak(answer);
    showToast('✅ 拼对啦！', true);
    setTimeout(() => {
      if(!letter) return;
      letter.i++;
      letter.state = null;
      letter.locked = false;
      if(letter.i >= letter.list.length) letterResult();
      else lgPrepareWord();
    }, 900);
  }else{
    letter.state = 'bad';
    letter.mistakes++;
    drawLetter();
    showToast('❌ 顺序不对，再试试～', false);
    setTimeout(() => {
      if(!letter) return;
      letter.state = null;
      lgClearSlots();
      letter.locked = false;
      drawLetter();
    }, 700);
  }
}

function speakLetter(ch){
  if(typeof speechSynthesis === 'undefined') return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(ch);
    u.lang = 'en-US'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function cleanupLetter(){
  document.removeEventListener('pointermove', lgDragMove);
  document.removeEventListener('pointerup', lgDragEnd);
  document.removeEventListener('pointercancel', lgDragEnd);
  if(lgDragEl){ lgDragEl.remove(); lgDragEl = null; }
  lgDragTile = null;
  letter = null;
}

function letterResult(){
  const body = document.getElementById('tabBody');
  const done = Math.min(letter.i, letter.list.length);
  const total = letter.list.length;
  const perfect = letter.perfect;
  body.innerHTML = `
    <div class="result-card" style="--h:${letter.unit.hue || 340}">
      <img class="r-mascot" src="${ART.cheer}" alt="">
      <h3>字母拼完啦！得分 ${letter.score} 分</h3>
      <p>一共拼出 ${done} 个单词，其中 ${perfect} 个一次就对～</p>
      <div class="result-btns">
        <button class="btn primary" id="lgAgain">🔄 再玩一次</button>
        <button class="btn" id="lgToQuiz">✏️ 去测一测</button>
      </div>
    </div>`;
  document.getElementById('lgAgain').onclick = () => startLetter(letter.unit);
  document.getElementById('lgToQuiz').onclick = () => {
    const unit = letter.unit;
    activateTab('quiz');
    cleanupLetter();
    startQuiz({ words: unit.words, pool: unit.words.length >= 4 ? unit.words : ALL_WORDS,
      container: document.getElementById('tabBody'), mode:'unit', unit, isMix: unit.isMix });
  };
}

/* =====================================================================
   12. 错题本
   ===================================================================== */
function renderWrong(){
  const list = wrongList();
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backHome">← 返回</button>
      <h2><span class="emoji">📕</span>&nbsp;我的错题本</h2>
    </div>
    ${list.length === 0
      ? `<div class="empty-box">
           <div class="big emoji">🌻</div>
           <h3>错题本是空的，太棒啦！</h3>
           <p>做错的单词会自动出现在这里，<br>到时候再来复习就好～</p>
         </div>`
      : `<div class="wrong-head">
           <span>共有 ${list.length} 个错题 · 点 ✓ 表示已掌握</span>
           <button class="btn primary" id="wrongQuizBtn">🎯 错题小测</button>
         </div>
         <div class="wrong-list" id="wrongList">
           ${list.map(w=>`
             <div class="wrong-card" data-en="${esc(w.en)}" style="--h:${w.hue||340}">
               <div class="wc-emoji">${emojiHtml(w.em)}</div>
               <div class="wc-info">
                 <div class="wc-en">${esc(w.en)}</div>
                 <div class="wc-meta">${esc(w.zh)}${w.unitName ? ' · ' + esc(w.unitName) : ''} · 错过 ${w.count} 次</div>
               </div>
               <div class="wc-btns">
                 <button class="mini" data-act="speak" title="听发音">🔊</button>
                 <button class="mini ok" data-act="master" title="已掌握">✓</button>
               </div>
             </div>`).join('')}
         </div>`}
    <div class="footer">✨ 消灭错题，成为单词小达人！ ✨</div>
  `;

  document.getElementById('backHome').onclick = () => { route = {name:'home'}; render(); };
  const quizBtn = document.getElementById('wrongQuizBtn');
  if(quizBtn) quizBtn.onclick = () => { route = {name:'wrongQuiz'}; render(); };

  const wrap = document.getElementById('wrongList');
  if(wrap){
    wrap.querySelectorAll('.wrong-card').forEach(card=>{
      const en = card.dataset.en;
      card.querySelectorAll('.mini').forEach(btn=>{
        btn.onclick = () => {
          if(btn.dataset.act === 'speak'){ speak(en); return; }
          removeWrong(en);
          card.style.transition = '.3s';
          card.style.opacity = '0';
          card.style.transform = 'translateX(40px)';
          setTimeout(renderWrong, 280);
        };
      });
    });
  }
}

function renderWrongQuiz(){
  const list = wrongList();
  if(list.length === 0){ route = {name:'wrong'}; render(); return; }
  app.innerHTML = `
    <div class="topbar">
      <button class="back" id="backWrong">← 错题本</button>
      <h2><span class="emoji">🎯</span>&nbsp;错题小测</h2>
    </div>
    <div id="wqBody"></div>`;
  document.getElementById('backWrong').onclick = () => { route = {name:'wrong'}; render(); };
  startQuiz({
    words: list.map(w=>({...w})),
    pool: ALL_WORDS, container: document.getElementById('wqBody'), mode:'wrong', variety:true
  });
}

/* =====================================================================
   13. 启动
   ===================================================================== */
render();
</script>
</body>
</html>
